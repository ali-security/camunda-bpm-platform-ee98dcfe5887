name: Seal build camunda-spin-dataformat-all

# Upstream builds and tests on Jenkins (Jenkinsfile + .ci/config); none of the
# GitHub workflows it ships build or test. This workflow mirrors the Jenkins
# build (temurin JDK 17 -- the published jar's MANIFEST says Build-Jdk 17 --
# Maven 3.9.9, default "distro" profile, mvn install) for the Spin modules:
# it builds camunda-spin-dataformat-all (which shades json-jackson, xml-dom,
# Jackson, json-path, json-smart and JAXB) and runs the unit tests of every
# Spin module (core, dataformat-json-jackson, dataformat-xml-dom).
#
# -Dclirr.skip=true: clirr (profile check-api-compatibility) is an API
# compatibility gate against Spin 7.22.0, not a test.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Surefire -Dtest selector; empty runs the full Spin suite'
        required: false
        default: ''

env:
  MAVEN_OPTS: -Xmx3g

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Set up Maven 3.9.9
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9
      - name: Install camunda-spin-dataformat-all and its reactor dependencies
        run: mvn -B -V install -pl spin/dataformat-all -am -DskipTests -Dclirr.skip=true
      - name: Spin unit tests (full suite)
        if: ${{ inputs.test-filter == '' }}
        run: mvn -B verify -pl spin/core,spin/dataformat-json-jackson,spin/dataformat-xml-dom,spin/dataformat-all -Dclirr.skip=true
      - name: Spin unit tests (selected)
        if: ${{ inputs.test-filter != '' }}
        env:
          FILTER: ${{ inputs.test-filter }}
        run: mvn -B verify -pl spin/core,spin/dataformat-json-jackson,spin/dataformat-xml-dom,spin/dataformat-all -Dclirr.skip=true -Dtest="${FILTER// /,}" -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
      - name: Print test summary and skipped tests (with skip reasons from surefire or test source)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, re
          import xml.etree.ElementTree as ET

          UNINFORMATIVE = re.compile(r'^\s*$|^got: ')


          def block_above(lines, idx):
              out, j = [], idx - 1
              while j >= 0:
                  s = lines[j].strip()
                  if not s or s.endswith('}') or (s.endswith(';') and not s.startswith(('*', '//'))):
                      break
                  out.insert(0, s)
                  j -= 1
              keep = []
              for s in out:
                  if re.match(r'@(Ignore|Disabled|Required\w*)\b', s):
                      keep.append(s)
                  elif s.startswith(('//', '*', '/*')) and s.strip('/* ') and '@author' not in s and not s.startswith('* @'):
                      keep.append(s.lstrip('/* ').rstrip())
              return keep


          def source_reason(src_root, cls, name):
              top = cls.split('$')[0]
              path = os.path.join(src_root, top.replace('.', '/') + '.java')
              if not os.path.exists(path):
                  return []
              lines = open(path, encoding='utf-8', errors='replace').read().split('\n')
              notes = []
              meth = re.sub(r'\[.*$', '', name or '')
              idx = next((i for i, l in enumerate(lines)
                          if re.search(r'\bvoid\s+' + re.escape(meth) + r'\s*\(', l)), None) if meth else None
              if idx is not None:
                  notes += block_above(lines, idx)
                  for l in lines[idx:idx + 40]:
                      if re.search(r'\b[Aa]ssume\w*\.\w+\(|\bassume(True|False|That)\(', l):
                          notes.append('assumption: ' + l.strip())
                          break
              simple = cls.split('.')[-1].split('$')[-1]
              cidx = next((i for i, l in enumerate(lines)
                           if re.search(r'\bclass\s+' + re.escape(simple) + r'\b', l)), None)
              if cidx is not None:
                  notes += ['class-level ' + n for n in block_above(lines, cidx) if n.startswith('@')]
              return notes


          t = f = e = s = 0
          for p in sorted(glob.glob('spin/*/target/surefire-reports/TEST-*.xml')):
              module = p.split('/')[1]
              src_root = os.path.join('spin', module, 'src/test/java')
              r = ET.parse(p).getroot()
              t += int(r.get('tests', 0)); f += int(r.get('failures', 0))
              e += int(r.get('errors', 0)); s += int(r.get('skipped', 0))
              for tc in r.iter('testcase'):
                  sk = tc.find('skipped')
                  if sk is None:
                      continue
                  cls, name = tc.get('classname'), tc.get('name')
                  msg = (sk.get('message') or '').strip()
                  parts = []
                  if msg and not UNINFORMATIVE.match(msg):
                      parts.append('skip message: ' + msg)
                  src = source_reason(src_root, cls, name)
                  if src:
                      if all(n in ('@Ignore', 'class-level @Ignore') for n in src):
                          src = src + ['disabled upstream by a bare @Ignore (no reason text in source)']
                      parts.append('source: ' + ' | '.join(src))
                  if msg and UNINFORMATIVE.match(msg):
                      parts.append('surefire: ' + msg)
                  if not parts:
                      parts.append('no reason recorded by surefire or in source annotations')
                  print(f"SKIPPED: [{module}] {cls}.{name} -- {'; '.join(parts)}")
          print(f"SUMMARY: tests={t} passed={t-f-e-s} failures={f} errors={e} skipped={s}")
          EOF
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: camunda-spin-dataformat-all
          if-no-files-found: error
          path: spin/dataformat-all/target/camunda-spin-dataformat-all-7.23.0-alpha2.jar
